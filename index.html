<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaron Workout</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      color: #cbd5e1;
      margin-top: 0;
    }

    .card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    label.section-label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .warmup {
      background: #1e293b;
      border-radius: 14px;
      padding: 12px;
      margin: 12px 0;
      color: #dbeafe;
      line-height: 1.4;
    }

    .round-row {
      display: grid;
      grid-template-columns: 1fr 56px 56px;
      gap: 10px;
      margin-top: 8px;
    }

    .round-display {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 14px;
      padding: 14px;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      background: #38bdf8;
      color: #06111f;
    }

    .gray {
      background: #64748b;
      color: white;
    }

    .reset {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      background: #fb7185;
      color: white;
      font-size: 16px;
    }

    .exercise {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #334155;
    }

    .exercise:last-child {
      border-bottom: none;
    }

    input[type="checkbox"] {
      width: 31px;
      height: 31px;
      accent-color: #22c55e;
      flex-shrink: 0;
    }

    .exercise-name {
      font-size: 18px;
      font-weight: bold;
    }

    .exercise-reps {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 3px;
    }

    .done .exercise-name,
    .done .exercise-reps {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .progress-shell {
      height: 12px;
      background: #1e293b;
      border-radius: 999px;
      margin-top: 14px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #22c55e;
    }

    .small {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Aaron Workout</h1>
    <p>Pick the day, track your round, and check off each exercise.</p>

    <div class="card">
      <label class="section-label" for="daySelect">Day</label>
      <select id="daySelect">
        <option value="0">Mon — Strength A</option>
        <option value="1">Tue — Conditioning</option>
        <option value="2">Wed — Strength B</option>
        <option value="3">Thu — Longevity / Resilience</option>
        <option value="4">Fri — Strength C</option>
        <option value="5">Sat — Power Day</option>
        <option value="6">Sun — Recovery Movement</option>
      </select>
    </div>

    <div class="card">
      <h2 id="title"></h2>
      <div class="warmup" id="warmup"></div>

      <label class="section-label">Round</label>
      <div class="round-row">
        <div class="round-display" id="roundDisplay"></div>
        <button class="gray" id="minusButton" type="button">−</button>
        <button id="plusButton" type="button">+</button>
      </div>
      <div class="small">Changing rounds clears the checklist for the new round.</div>
    </div>

    <div class="card">
      <label class="section-label">Exercise Checklist</label>
      <div id="exerciseList"></div>

      <div class="progress-shell">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="small" id="progressText"></div>
      <button class="reset" id="resetButton" type="button">Reset Today</button>
    </div>
  </div>

  <script>
    var workouts = [
      {
        name: "Mon — Strength A",
        rounds: 5,
        warmup: "Warm-up: Jumping Jacks, Bodyweight Squats, Hip Hinges. 2 minutes.",
        exercises: [
          ["Bulgarian Split Squat", "8 per leg"],
          ["Dumbbell Bench Press", "8 reps"],
          ["Suitcase Carry", "45 sec per side"]
        ]
      },
      {
        name: "Tue — Conditioning",
        rounds: 9,
        warmup: "Warm-up: Easy March. 2 minutes.",
        exercises: [
          ["Hard Effort", "30 sec"],
          ["Easy Effort", "30 sec"],
          ["Fast Step-Ups", "choose this or another option"],
          ["Jumping Jacks", "option"],
          ["Shadow Boxing", "option"],
          ["Fast Marching", "option"]
        ]
      },
      {
        name: "Wed — Strength B",
        rounds: 5,
        warmup: "Warm-up: Hip Hinges and Arm Swings. 2 minutes.",
        exercises: [
          ["Romanian Deadlift", "10 reps"],
          ["One-Arm Row", "10 per side"],
          ["Suitcase Carry", "45 sec per side"]
        ]
      },
      {
        name: "Thu — Longevity / Resilience",
        rounds: 4,
        warmup: "Warm-up: Easy Movement. 2 minutes.",
        exercises: [
          ["Step-Up", "10 per leg"],
          ["McGill Curl-Up", "8 reps"],
          ["Bird Dog", "8 per side"],
          ["Dumbbell Overhead Press", "8 reps"],
          ["Farmer Carry", "45 sec"]
        ]
      },
      {
        name: "Fri — Strength C",
        rounds: 5,
        warmup: "Warm-up: Easy Movement. 2 minutes.",
        exercises: [
          ["Reverse Lunge", "8 per leg"],
          ["Incline Dumbbell Bench Press", "8 reps"],
          ["Farmer Carry", "60 sec"]
        ]
      },
      {
        name: "Sat — Power Day",
        rounds: 6,
        warmup: "Warm-up: Easy Movement. 2 minutes. Move explosively, but stop before sloppy reps.",
        exercises: [
          ["Push Press", "5 reps"],
          ["Fast Step-Ups", "10 per leg"],
          ["Farmer Carry", "60 sec"]
        ]
      },
      {
        name: "Sun — Recovery Movement",
        rounds: 1,
        warmup: "Stay comfortable. If recovery is poor, just walk.",
        exercises: [
          ["Push-Ups", "10 reps"],
          ["Bird Dog", "8 per side"],
          ["Step-Ups", "10 per leg"],
          ["Suitcase Carry", "45 sec per side"],
          ["Walk", "optional replacement"]
        ]
      }
    ];

    var currentDay = 0;
    var currentRound = 1;
    var checked = [];

    var daySelect = document.getElementById("daySelect");
    var title = document.getElementById("title");
    var warmup = document.getElementById("warmup");
    var roundDisplay = document.getElementById("roundDisplay");
    var exerciseList = document.getElementById("exerciseList");
    var progressBar = document.getElementById("progressBar");
    var progressText = document.getElementById("progressText");

    function resetChecks() {
      checked = [];
      for (var i = 0; i < workouts[currentDay].exercises.length; i++) {
        checked.push(false);
      }
    }

    function updateProgress() {
      var done = 0;
      for (var i = 0; i < checked.length; i++) {
        if (checked[i]) done++;
      }

      var total = checked.length;
      var percent = total === 0 ? 0 : Math.round((done / total) * 100);

      progressBar.style.width = percent + "%";
      progressText.textContent = done + " of " + total + " exercises checked.";
    }

    function drawWorkout() {
      var workout = workouts[currentDay];

      title.textContent = workout.name;
      warmup.textContent = workout.warmup;

      if (workout.rounds === 1) {
        roundDisplay.textContent = "Easy circuit";
      } else {
        roundDisplay.textContent = currentRound + " / " + workout.rounds;
      }

      exerciseList.innerHTML = "";

      for (var i = 0; i < workout.exercises.length; i++) {
        var exercise = workout.exercises[i];

        var row = document.createElement("label");
        row.className = "exercise";

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = checked[i];
        checkbox.setAttribute("data-index", i);

        var textBox = document.createElement("div");

        var exerciseName = document.createElement("div");
        exerciseName.className = "exercise-name";
        exerciseName.textContent = exercise[0];

        var exerciseReps = document.createElement("div");
        exerciseReps.className = "exercise-reps";
        exerciseReps.textContent = exercise[1];

        textBox.appendChild(exerciseName);
        textBox.appendChild(exerciseReps);

        row.appendChild(checkbox);
        row.appendChild(textBox);

        if (checked[i]) {
          row.classList.add("done");
        }

        checkbox.addEventListener("change", function(event) {
          var index = Number(event.target.getAttribute("data-index"));
          checked[index] = event.target.checked;

          if (event.target.checked) {
            event.target.parentElement.classList.add("done");
          } else {
            event.target.parentElement.classList.remove("done");
          }

          updateProgress();
        });

        exerciseList.appendChild(row);
      }

      updateProgress();
    }

    function changeDay(dayIndex) {
      currentDay = dayIndex;
      currentRound = 1;
      resetChecks();
      drawWorkout();
    }

    daySelect.addEventListener("change", function() {
      changeDay(Number(daySelect.value));
    });

    document.getElementById("plusButton").addEventListener("click", function() {
      if (currentRound < workouts[currentDay].rounds) {
        currentRound++;
      }
      resetChecks();
      drawWorkout();
    });

    document.getElementById("minusButton").addEventListener("click", function() {
      if (currentRound > 1) {
        currentRound--;
      }
      resetChecks();
      drawWorkout();
    });

    document.getElementById("resetButton").addEventListener("click", function() {
      currentRound = 1;
      resetChecks();
      drawWorkout();
    });

    resetChecks();
    drawWorkout();
  </script>
</body>
</html>
